<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#241623">
	<title>A Little Love</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="love-scene" aria-label="A little love animation">
		<span class="sparkle sparkle-one" aria-hidden="true">✦</span>
		<span class="sparkle sparkle-two" aria-hidden="true">✧</span>
		<span class="floating-heart float-one" aria-hidden="true">♥</span>
		<span class="floating-heart float-two" aria-hidden="true">♥</span>
		<span class="floating-heart float-three" aria-hidden="true">♥</span>

		<div class="message">
			<p class="eyebrow">A LITTLE REMINDER</p>
			<h1>You are loved</h1>
			<p class="caption">Today, tomorrow, always.</p>
		</div>

		<div class="heart-wrap" role="img" aria-label="A bright pink heart gently beating">
			<span class="heart">♥</span>
		</div>
	</main>
</body>
</html>
